<style>
:root {
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Charter, Georgia, serif;
  --ui: "Seravek", "Avenir Next", "Candara", "Segoe UI Variable Text", "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", "Berkeley Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;

  --paper: #ece5d3;
  --paper-2: #e3dbc5;
  --slip: #faf6ec;
  --slip-2: #f2ecdb;
  --ink: #1c1a14;
  --ink-2: #4b463a;
  --ink-3: #766f5d;
  --rule: #d3c9af;
  --rule-2: #e3dbc5;
  --pencil: #2145c7;
  --pencil-wash: rgba(33, 69, 199, .085);
  --ok: #1b7a4a;
  --ok-wash: rgba(27, 122, 74, .12);
  --warn: #9f6409;
  --warn-wash: rgba(159, 100, 9, .14);
  --bad: #b3301f;
  --bad-wash: rgba(179, 48, 31, .10);
  --on-solid: #fffdf6;
  --shadow: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 1px 2px rgba(70, 50, 10, .10), 0 10px 26px -14px rgba(70, 50, 10, .35);
  --tone: 34%;
  --tone-a: .17;
  --margin-line: rgba(179, 48, 31, .38);
  --grain-op: .09;
  --grain-filter: none;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12110d;
    --paper-2: #0d0c09;
    --slip: #1b1a14;
    --slip-2: #17160f;
    --ink: #ece6d4;
    --ink-2: #bdb59e;
    --ink-3: #8a836e;
    --rule: #34301f;
    --rule-2: #26231a;
    --pencil: #86a2ff;
    --pencil-wash: rgba(134, 162, 255, .10);
    --ok: #62d296;
    --ok-wash: rgba(98, 210, 150, .12);
    --warn: #e8b64f;
    --warn-wash: rgba(232, 182, 79, .13);
    --bad: #f08171;
    --bad-wash: rgba(240, 129, 113, .12);
    --on-solid: #0f0e0a;
    --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 1px 2px rgba(0, 0, 0, .5), 0 12px 28px -14px rgba(0, 0, 0, .8);
    --tone: 72%;
    --tone-a: .22;
    --margin-line: rgba(240, 129, 113, .35);
    --grain-op: .05;
    --grain-filter: invert(1);
  }
}
:root[data-theme="dark"] {
  --paper: #12110d;
  --paper-2: #0d0c09;
  --slip: #1b1a14;
  --slip-2: #17160f;
  --ink: #ece6d4;
  --ink-2: #bdb59e;
  --ink-3: #8a836e;
  --rule: #34301f;
  --rule-2: #26231a;
  --pencil: #86a2ff;
  --pencil-wash: rgba(134, 162, 255, .10);
  --ok: #62d296;
  --ok-wash: rgba(98, 210, 150, .12);
  --warn: #e8b64f;
  --warn-wash: rgba(232, 182, 79, .13);
  --bad: #f08171;
  --bad-wash: rgba(240, 129, 113, .12);
  --on-solid: #0f0e0a;
  --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 1px 2px rgba(0, 0, 0, .5), 0 12px 28px -14px rgba(0, 0, 0, .8);
  --tone: 72%;
  --tone-a: .22;
  --margin-line: rgba(240, 129, 113, .35);
  --grain-op: .05;
  --grain-filter: invert(1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; color-scheme: light dark; }
html[data-theme="light"] { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 14px/1.45 var(--ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: var(--grain-op);
  filter: var(--grain-filter);
  background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAiIGhlaWdodD0iMTYwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjg1IiBudW1PY3RhdmVzPSIyIiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPSIwIDAgMCAwIDAuMzUgIDAgMCAwIDAgMC4zICAwIDAgMCAwIDAuMiAgMCAwIDAgLjU1IDAiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjbikiLz48L3N2Zz4=");
}
#root { position: relative; z-index: 1; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--pencil); color: var(--on-solid); }

.ico { flex: none; display: block; }
kbd {
  font: 600 10.5px/1 var(--mono);
  padding: 2px 5px 3px;
  border: 1px solid var(--rule);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--slip);
  color: var(--ink-2);
}

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 7px 13px;
  border: 1px solid var(--rule);
  border-radius: 7px;
  background: var(--slip);
  color: var(--ink);
  font-weight: 600;
  font-size: 13px;
  line-height: 1.2;
  box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 1px 1px rgba(60,45,10,.06);
  transition: transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--ok); border-color: var(--ok); color: var(--on-solid); }
.btn.primary:hover:not(:disabled) { border-color: var(--ok); filter: brightness(1.08); }
.btn.pencil { background: var(--pencil); border-color: var(--pencil); color: var(--on-solid); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--rule)); }
.btn.danger:hover:not(:disabled) { background: var(--bad-wash); border-color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: var(--on-solid); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover:not(:disabled) { background: var(--pencil-wash); border-color: transparent; color: var(--ink); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
.btn.icon { padding: 7px; }
.btn kbd { background: transparent; border-color: currentColor; color: inherit; opacity: .7; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lab {
  font: 600 10px/1.2 var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
input[type="text"], input[type="password"], input[type="search"], textarea, select {
  width: 100%;
  min-width: 0;
  padding: 7px 10px;
  background: var(--slip);
  border: 1px solid var(--rule);
  border-radius: 7px;
  font-size: 13px;
  box-shadow: 0 1px 2px rgba(60,45,10,.05) inset;
  transition: border-color .15s ease, box-shadow .15s ease;
}
textarea { resize: vertical; line-height: 1.5; }
input.mono, textarea.mono, select.mono { font-family: var(--mono); font-size: 12.5px; }
input:hover, textarea:hover, select:hover { border-color: var(--ink-3); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--pencil); box-shadow: 0 0 0 3px var(--pencil-wash); }
input.bad, select.bad { border-color: var(--bad); }
select { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer; }
.selwrap { position: relative; display: block; min-width: 0; }
.selwrap::after {
  content: ""; position: absolute; right: 12px; top: 50%;
  width: 6px; height: 6px;
  border-right: 1.6px solid var(--ink-3); border-bottom: 1.6px solid var(--ink-3);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
.ferr { color: var(--bad); font-size: 12px; min-height: 0; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font: 700 10px/1 var(--mono);
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 4px 6px 4px;
  border-radius: 4px;
  border: 1px solid var(--rule);
  color: var(--ink-2);
  background: var(--slip-2);
  white-space: nowrap;
}
.badge.mtn { --h: 44; color: hsl(var(--h) 80% calc(var(--tone) - 6%)); background: hsl(var(--h) 90% 55% / .2); border-color: hsl(var(--h) 80% 45% / .45); }
.badge.airtel { --h: 4; color: hsl(var(--h) 70% var(--tone)); background: hsl(var(--h) 80% 55% / .16); border-color: hsl(var(--h) 70% 48% / .4); }
.badge.type { color: var(--pencil); background: var(--pencil-wash); border-color: color-mix(in srgb, var(--pencil) 35%, transparent); }
.badge.ok { color: var(--ok); background: var(--ok-wash); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.badge.bad { color: var(--bad); background: var(--bad-wash); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.badge.warn { color: var(--warn); background: var(--warn-wash); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }

.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; box-shadow: 0 0 0 3px transparent; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-wash); }
.dot.bad { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-wash); }
.dot.unk { background: transparent; border: 1.5px dashed var(--ink-3); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100vh; height: 100dvh; }
.demo-strip {
  font: 600 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; text-align: center;
  padding: 6px 12px; background: repeating-linear-gradient(135deg, var(--warn-wash) 0 10px, transparent 10px 20px);
  color: var(--warn); border-bottom: 1px solid var(--rule);
}
.mast {
  display: flex; align-items: center; gap: 18px;
  padding: 10px 18px; padding-top: calc(10px + env(safe-area-inset-top));
  border-bottom: 3px double var(--rule);
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.mark {
  width: 32px; height: 32px; border-radius: 8px; flex: none;
  background: var(--ink); color: var(--paper);
  display: grid; place-items: center;
  font: italic 700 21px/1 var(--display);
  box-shadow: 0 2px 0 var(--pencil);
}
.brand-name { font: italic 600 25px/1 var(--display); letter-spacing: -.01em; }
.brand-sub { font: 600 9.5px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); margin-top: 5px; }
.nav { display: flex; gap: 4px; margin-left: 14px; }
.nav button {
  position: relative; border: 0; background: transparent;
  font: 600 11.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); padding: 11px 12px; border-radius: 6px;
  transition: color .15s ease, background .15s ease;
}
.nav button:hover { color: var(--ink); background: var(--pencil-wash); }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"]::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: 3px; height: 2px;
  background: var(--pencil); border-radius: 2px;
}
.nav .n { font-size: 9.5px; margin-left: 6px; color: var(--pencil); vertical-align: 4px; letter-spacing: 0; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.ver {
  font: 500 11px/1 var(--mono); color: var(--ink-2);
  padding: 6px 9px; border: 1px dashed var(--rule); border-radius: 999px; background: transparent;
  display: inline-flex; gap: 7px; align-items: center; max-width: 260px;
}
.ver span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ver:hover { border-color: var(--ink-3); }

.ticker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); background: var(--slip-2); }
.tick { display: flex; align-items: baseline; gap: 12px; padding: 7px 18px; border-right: 1px solid var(--rule-2); min-width: 0; overflow: hidden; }
.tick:last-child { border-right: 0; }
.tick .lab { white-space: nowrap; }
.tick .val { font: 600 26px/1 var(--display); font-variant-numeric: tabular-nums lining-nums; letter-spacing: -.01em; }
.tick .sub { font: 500 11px/1 var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tick .val.flash { animation: flash .9s ease; }
@keyframes flash { 0% { color: var(--pencil); transform: translateY(-2px); } 100% { color: inherit; transform: none; } }

.bottomnav { display: none; }

/* ---------- queue ---------- */
.view { min-height: 0; height: 100%; }
.v-queue { display: grid; grid-template-columns: minmax(300px, 390px) minmax(0, 1fr); }
.qpane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); }
.qhead { padding: 14px 14px 10px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; }
.qtitle { display: flex; align-items: baseline; gap: 10px; }
.qtitle h2 { margin: 0; font: italic 600 22px/1 var(--display); }
.qtitle .meta { font: 500 11px/1 var(--mono); color: var(--ink-3); }
.qtitle .btn { margin-left: auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill {
  border: 1px solid var(--rule); background: transparent; color: var(--ink-2);
  font: 600 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 6px 9px; border-radius: 999px; transition: all .15s ease;
}
.pill:hover { border-color: var(--ink-3); color: var(--ink); }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.qlist { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; overscroll-behavior: contain; }
.row {
  display: block; width: 100%; text-align: left;
  border: 0; border-bottom: 1px solid var(--rule-2); border-left: 3px solid transparent;
  background: transparent; padding: 11px 14px 10px 12px;
  position: relative;
  animation: rise .35s ease backwards;
  animation-delay: calc(var(--i, 0) * 22ms);
}
.row:hover { background: color-mix(in srgb, var(--pencil-wash) 55%, transparent); }
.row[aria-current="true"] { background: var(--pencil-wash); border-left-color: var(--pencil); }
.row:focus-visible { outline-offset: -3px; }
.qlist.noanim .row { animation: none; }
.row-top { display: flex; align-items: center; gap: 8px; }
.row-top .count { margin-left: auto; font: 600 19px/1 var(--display); font-variant-numeric: tabular-nums lining-nums; }
.row-top .count small { font: 500 11px var(--mono); color: var(--ink-3); margin-right: 1px; }
.row-skel { margin: 8px 0 7px; font: 500 11.5px/1.95 var(--mono); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.row-meta { display: flex; gap: 10px; font: 500 10.5px/1 var(--mono); color: var(--ink-3); align-items: center; }
.bar { height: 2px; background: var(--rule-2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pencil); opacity: .55; border-radius: 2px; }
.qfoot { padding: 10px 14px; border-top: 1px solid var(--rule); display: flex; justify-content: center; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- placeholder chips ---------- */
.chip {
  --h: 40;
  display: inline-flex; align-items: baseline; gap: 4px;
  font: 600 .86em/1 var(--mono);
  padding: 3px 6px 3px;
  margin: 0 1px;
  border-radius: 5px;
  color: hsl(var(--h) 62% var(--tone));
  background: hsl(var(--h) 80% 52% / var(--tone-a));
  border: 1px solid hsl(var(--h) 60% 48% / .38);
  vertical-align: baseline;
  white-space: nowrap;
}
.chip .ix {
  font-size: .72em; font-weight: 700; padding: 1px 4px; border-radius: 3px;
  background: hsl(var(--h) 60% var(--tone)); color: var(--slip);
  align-self: center; line-height: 1.2;
}
.k-N { --h: 40; }
.k-PH { --h: 282; }
.k-TS { --h: 186; }
.k-TID { --h: 334; }
.k-W { --h: 14; }
.k-Wp { --h: 4; border-style: dashed; border-width: 1.5px; }
.k-URL, .k-EMAIL { --h: 215; }
.lit { white-space: pre-wrap; }

.g1 { --h: 14; } .g2 { --h: 160; } .g3 { --h: 215; } .g4 { --h: 285; }
.g5 { --h: 42; } .g6 { --h: 335; } .g7 { --h: 95; } .g8 { --h: 190; }
.rx {
  border-radius: 3px; padding: 1px 0;
  background: hsl(var(--h) 80% 52% / var(--tone-a));
  box-shadow: inset 0 -2px 0 hsl(var(--h) 62% var(--tone) / .85);
}
.gnum {
  display: inline-grid; place-items: center; min-width: 15px; height: 15px; padding: 0 3px;
  border-radius: 8px; margin: 0 2px 0 3px; vertical-align: 2px;
  font: 700 9px/1 var(--mono); background: hsl(var(--h) 60% var(--tone)); color: var(--slip);
}
.swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; background: hsl(var(--h) 80% 52% / .35); box-shadow: inset 0 0 0 1.5px hsl(var(--h) 62% var(--tone)); }
.swatch.none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--rule); }

/* ---------- detail ---------- */
.dpane { min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.dscroll { flex: 1; min-height: 0; overflow: auto; container-type: inline-size; overscroll-behavior: contain; }
.dempty { height: 100%; display: grid; place-items: center; padding: 30px; text-align: center; }
.dempty .art { width: 220px; margin: 0 auto 18px; }
.dempty h3, .empty h3 { margin: 0 0 6px; font: italic 600 26px/1.15 var(--display); }
.dempty p, .empty p { margin: 0 auto 14px; color: var(--ink-2); max-width: 44ch; }
.dempty .keys { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; color: var(--ink-3); font-size: 12px; }
.dwrap { padding: 18px 22px 30px; max-width: 1320px; margin: 0 auto; animation: rise .3s ease; }
.gone { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; margin-bottom: 14px; border: 1px solid var(--warn); border-radius: 9px; background: var(--warn-wash); color: var(--warn); font-weight: 600; }
.gone span { flex: 1; min-width: 200px; }
.dhead { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.dhead .back { display: none; }
.dtitle { min-width: 0; flex: 1; }
.dtitle h2 { margin: 0 0 6px; font: italic 600 26px/1.15 var(--display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.dmeta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font: 500 11.5px/1.3 var(--mono); color: var(--ink-3); }
.dmeta b { color: var(--ink); font-weight: 600; }
.dnav { display: flex; gap: 2px; }
.dgrid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@container (min-width: 960px) { .dgrid { grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--slip); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 11px 14px 9px; border-bottom: 1px solid var(--rule-2); }
.card-h h3 { margin: 0; font: 600 10.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
.card-h .sp { margin-left: auto; display: flex; align-items: center; gap: 6px; font: 500 11px/1 var(--mono); color: var(--ink-3); }
.card-b { padding: 14px; }
.card.flash { animation: cardflash 1s ease; }
@keyframes cardflash { 0% { box-shadow: 0 0 0 3px var(--pencil); } 100% { box-shadow: var(--shadow); } }

.slipwrap { position: relative; }
.slip {
  position: relative;
  padding: 0 18px 0 48px;
  min-height: 62px;
  background-image:
    linear-gradient(to right, transparent 35px, var(--margin-line) 35px 36px, transparent 36px),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule-2) 31px 32px);
  border-radius: 0 0 10px 10px;
}
.slip-text { font: 500 13.5px/32px var(--mono); overflow-wrap: anywhere; color: var(--ink); }
.slip-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 10px 14px; border-top: 1px solid var(--rule-2); align-items: center; }
.spark { display: block; }
.spark rect { fill: var(--pencil); opacity: .55; }
.spark rect.last { opacity: 1; }
.hints { display: flex; flex-wrap: wrap; gap: 6px; }
.hint { font: 500 11px/1 var(--mono); padding: 5px 8px; border-radius: 5px; background: var(--slip-2); border: 1px solid var(--rule-2); color: var(--ink-2); }
.hint b { color: var(--ink); }

.stamp {
  position: absolute; right: 22px; top: 18px; z-index: 5; pointer-events: none;
  font: 800 30px/1 var(--display); letter-spacing: .14em; text-transform: uppercase;
  padding: 8px 16px 6px; border: 4px double currentColor; border-radius: 6px;
  transform: rotate(-9deg);
  animation: thunk .5s cubic-bezier(.2, 1.7, .4, 1) both;
  mix-blend-mode: normal; background: color-mix(in srgb, var(--slip) 70%, transparent);
}
.stamp.approved { color: var(--ok); }
.stamp.rejected { color: var(--bad); }
@keyframes thunk { 0% { opacity: 0; transform: rotate(-9deg) scale(2.2); } 55% { opacity: 1; transform: rotate(-9deg) scale(.94); } 100% { opacity: 1; transform: rotate(-9deg) scale(1); } }

.regex { font: 500 12.5px/2 var(--mono); word-break: break-all; padding: 12px 14px; position: relative; }
.regex-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 9px 14px; border-top: 1px solid var(--rule-2); font: 500 11px/1.2 var(--mono); color: var(--ink-3); }
.conf { display: inline-flex; align-items: center; gap: 7px; }
.conf i { width: 56px; height: 5px; border-radius: 3px; background: var(--rule-2); overflow: hidden; display: block; }
.conf i b { display: block; height: 100%; background: var(--ok); }
.conf.low i b { background: var(--bad); }
.conf.mid i b { background: var(--warn); }
.notes { margin: 0; padding: 0 14px 12px 28px; color: var(--ink-2); font-size: 12.5px; }
.notes li { margin: 2px 0; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.editor .sect { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--rule); }
.editor .sect:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.roles { display: grid; grid-template-columns: auto minmax(104px, 150px) 1fr; gap: 8px 12px; align-items: center; margin-top: 8px; }
.roles .rl { font-weight: 600; font-size: 13px; }
.roles .rl small { color: var(--bad); font: 600 9.5px var(--mono); letter-spacing: .08em; margin-left: 5px; }
.roles .gsel { display: flex; align-items: center; gap: 8px; }
.roles .samp { font: 500 12px/1.3 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; min-height: 1em; }
.lits { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.lit-row { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.lit-row .ctx { font: 500 11.5px/1.5 var(--mono); color: var(--ink-3); grid-column: 1 / -1; overflow-wrap: anywhere; }
.lit-row .ctx em { font-style: normal; color: var(--ink); }
.helptext { font-size: 12px; color: var(--ink-3); margin: 4px 0 0; }

.gate-sum { display: flex; align-items: center; gap: 12px; padding: 12px 14px 4px; }
.gatebar { display: flex; gap: 3px; flex: 1; }
.gatebar i { flex: 1; height: 6px; border-radius: 3px; background: var(--ok); }
.gatebar i.f { background: var(--bad); }
.gatebar i.p { background: var(--rule); }
.gate-sum .tally { font: 700 12px/1 var(--mono); white-space: nowrap; }
.checks { padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 2px; transition: opacity .2s ease; }
.checks.stale { opacity: .45; filter: saturate(.4); }
.check { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 9px; padding: 7px 8px; border-radius: 7px; }
.check.f { background: var(--bad-wash); }
.check.w { background: var(--warn-wash); }
.check .ck { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--on-solid); background: var(--ok); margin-top: 1px; }
.check.f .ck { background: var(--bad); }
.check.w .ck { background: var(--warn); }
.check .nm { font-weight: 600; font-size: 13px; }
.check .dt { font: 500 11.5px/1.45 var(--mono); color: var(--ink-3); overflow-wrap: anywhere; margin-top: 1px; }
.check.f .dt, .check.w .dt { color: var(--ink-2); }

.testbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.testbar .sp { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--ink-3); }
.verdict { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-weight: 700; margin-top: 12px; }
.verdict.ok { background: var(--ok-wash); color: var(--ok); }
.verdict.warn { background: var(--warn-wash); color: var(--warn); }
.verdict.bad { background: var(--bad-wash); color: var(--bad); }
.verdict .ms { margin-left: auto; font: 600 11.5px/1 var(--mono); display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.ms-bar { width: 54px; height: 5px; border-radius: 3px; background: var(--rule-2); overflow: hidden; }
.ms-bar i { display: block; height: 100%; background: var(--ok); }
.ms-bar i.hot { background: var(--bad); }
.hl { font: 500 13px/2 var(--mono); padding: 11px 13px; margin-top: 10px; background: var(--slip-2); border: 1px solid var(--rule-2); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tbl { margin-top: 10px; display: grid; grid-template-columns: auto auto 1fr; gap: 6px 10px; align-items: center; font-size: 12.5px; }
.tbl .k { font: 600 11.5px/1 var(--mono); color: var(--ink-2); }
.tbl .v { font: 500 12.5px/1.35 var(--mono); overflow-wrap: anywhere; }
.tbl .v.null { color: var(--ink-3); font-style: italic; }
.tbl-h { margin: 14px 0 0; }
.fields { margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.fld { padding: 8px 10px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--slip-2); min-width: 0; }
.fld .fk { display: flex; align-items: center; gap: 6px; font: 600 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.fld .fraw { margin-top: 4px; font: 500 10.5px/1.2 var(--mono); color: var(--ink-3); overflow-wrap: anywhere; }
.fld .fv { margin-top: 5px; font: 600 15px/1.2 var(--display); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

.actionbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 22px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
}
.ab-status { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font: 500 11.5px/1 var(--mono); color: var(--ink-2); margin-right: auto; min-width: 0; }
.ab-status span { display: inline-flex; align-items: center; gap: 7px; }

/* ---------- live / vocab ---------- */
.page { height: 100%; overflow: auto; overscroll-behavior: contain; }
.page-in { max-width: 1040px; margin: 0 auto; padding: 22px 22px 40px; }
.page-h { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.page-h h2 { margin: 0; font: italic 600 30px/1 var(--display); letter-spacing: -.01em; }
.page-h p { margin: 6px 0 0; color: var(--ink-2); max-width: 62ch; }
.page-h .sp { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.verbox { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 11px 14px; margin-bottom: 14px; border: 1px dashed var(--rule); border-radius: 10px; font: 500 12px/1.3 var(--mono); color: var(--ink-2); }
.verbox b { color: var(--ink); }
.verbox.degraded { border-color: var(--warn); background: var(--warn-wash); color: var(--warn); }
.cards { display: flex; flex-direction: column; gap: 12px; }
.live-card { padding: 0; overflow: hidden; animation: rise .3s ease backwards; animation-delay: calc(var(--i, 0) * 30ms); }
.live-card.off { background: repeating-linear-gradient(135deg, transparent 0 12px, var(--bad-wash) 12px 13px), var(--slip); }
.live-card.off .live-id { text-decoration: line-through; text-decoration-color: var(--bad); }
.live-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; flex-wrap: wrap; }
.live-id { font: 600 14px/1.2 var(--mono); overflow-wrap: anywhere; }
.live-top .sp { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.switch { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 2px; font: 700 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.switch .track { width: 38px; height: 22px; border-radius: 11px; background: var(--rule); position: relative; transition: background .2s ease; }
.switch .track::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--slip); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .2s cubic-bezier(.3, 1.5, .5, 1); }
.switch[aria-checked="true"] .track { background: var(--ok); }
.switch[aria-checked="true"] .track::after { transform: translateX(16px); }
.live-pat { border-top: 1px solid var(--rule-2); background: var(--slip-2); font: 500 12px/1.9 var(--mono); padding: 10px 14px; overflow-wrap: anywhere; max-height: 74px; overflow: hidden; position: relative; cursor: pointer; }
.live-pat.open { max-height: none; }
.live-pat:not(.open)::after { content: ""; position: absolute; inset: auto 0 0 0; height: 30px; background: linear-gradient(to bottom, transparent, var(--slip-2)); pointer-events: none; }
.live-foot { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 8px 14px 10px; font: 500 11px/1.2 var(--mono); color: var(--ink-3); }
.words { display: flex; flex-wrap: wrap; gap: 7px; }
.word { display: inline-flex; align-items: center; gap: 4px; padding: 5px 5px 5px 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--slip); font: 500 12.5px/1 var(--mono); animation: rise .25s ease backwards; }
.word button { border: 0; background: transparent; color: var(--ink-3); padding: 3px; border-radius: 4px; display: grid; place-items: center; }
.word button:hover { color: var(--bad); background: var(--bad-wash); }
.explain { margin-top: 30px; padding-top: 16px; border-top: 1px dashed var(--rule); }
.ex-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 13px; line-height: 2; flex-wrap: wrap; }
.ex-tag { font: 700 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); width: 52px; }
.addrow { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.addrow input { flex: 1 1 240px; }
.empty { text-align: center; padding: 46px 20px; border: 1px dashed var(--rule); border-radius: 12px; color: var(--ink-2); }
.empty .art { width: 150px; margin: 0 auto 14px; color: var(--ink-3); }
.qempty { padding: 38px 18px; text-align: center; color: var(--ink-2); }
.qempty h3 { margin: 10px 0 6px; font: italic 600 22px/1.15 var(--display); color: var(--ink); }
.qempty p { margin: 0 auto 14px; max-width: 30ch; font-size: 13px; }
.skel { height: 74px; margin: 10px 14px; border-radius: 8px; background: linear-gradient(100deg, var(--rule-2) 30%, var(--slip-2) 50%, var(--rule-2) 70%); background-size: 220% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

/* ---------- unlock ---------- */
.unlock { height: 100vh; height: 100dvh; display: grid; place-items: center; padding: 20px; overflow: auto; }
.ucard { width: min(440px, 100%); position: relative; padding: 0; animation: rise .5s ease; }
.ucard .utop { padding: 26px 28px 8px 56px; position: relative; background-image: linear-gradient(to right, transparent 39px, var(--margin-line) 39px 40px, transparent 40px); }
.ucard .utop h1 { margin: 12px 0 4px; font: italic 600 42px/1 var(--display); letter-spacing: -.02em; }
.ucard .utop p { margin: 0; font: 600 10px/1.5 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
.ucard form { padding: 18px 28px 24px 56px; display: flex; flex-direction: column; gap: 12px; background-image: linear-gradient(to right, transparent 39px, var(--margin-line) 39px 40px, transparent 40px); }
.tokrow { position: relative; }
.tokrow input { padding-right: 44px; height: 42px; }
.tokrow .btn { position: absolute; right: 4px; top: 4px; }
.umsg { min-height: 20px; font-size: 13px; color: var(--bad); }
.umsg.info { color: var(--ink-2); }
.ufoot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
.shake { animation: shake .4s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.tear { height: 14px; background: radial-gradient(circle at 7px 0, transparent 6px, var(--slip) 6.5px) 0 0 / 14px 14px repeat-x; margin-top: -1px; transform: scaleY(-1); filter: drop-shadow(0 -1px 0 var(--rule)); }

/* ---------- overlay / toasts ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(15, 12, 5, .45); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 18px; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { width: min(520px, 100%); max-height: calc(100dvh - 36px); overflow: auto; background: var(--slip); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.55); animation: pop .22s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
.modal-h { padding: 18px 20px 4px; }
.modal-h h2 { margin: 0; font: italic 600 25px/1.15 var(--display); }
.modal-b { padding: 8px 20px 4px; color: var(--ink-2); }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px 18px; flex-wrap: wrap; }
.sumtbl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 10px 0 6px; padding: 12px; background: var(--slip-2); border: 1px solid var(--rule-2); border-radius: 8px; font-size: 13px; }
.sumtbl dt { font: 600 10px/1.8 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.sumtbl dd { margin: 0; font: 500 12.5px/1.5 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
.keytbl { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; align-items: center; margin: 10px 0 6px; }
.keytbl div:nth-child(odd) { display: flex; gap: 4px; justify-content: flex-end; }
.toasts { position: fixed; right: 16px; bottom: 78px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; max-width: 420px; padding: 10px 12px 10px 13px; border-radius: 9px; background: var(--ink); color: var(--paper); box-shadow: 0 14px 34px -12px rgba(0,0,0,.55); font-size: 13px; border-left: 4px solid var(--pencil); animation: tin .28s cubic-bezier(.2, 1.3, .4, 1); }
.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--bad); }
.toast.out { animation: tout .2s ease forwards; }
.toast button { background: transparent; border: 0; color: inherit; opacity: .6; padding: 0 2px; margin-left: 4px; }
.toast button:hover { opacity: 1; }
@keyframes tin { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes tout { to { opacity: 0; transform: translateY(8px); } }

/* ---------- phone ---------- */
@media (max-width: 860px) {
  .mast { padding: 8px 14px; padding-top: calc(8px + env(safe-area-inset-top)); gap: 10px; }
  .brand-name { font-size: 22px; }
  .brand-sub { display: none; }
  .mast .nav { display: none; }
  .ver { display: none; }
  .ticker { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tick { flex-direction: column; align-items: flex-start; gap: 4px; padding: 7px 10px; }
  .tick .val { font-size: 21px; }
  .tick .sub { display: none; }
  .tick .lab { font-size: 8.5px; letter-spacing: .1em; white-space: normal; line-height: 1.25; }
  .v-queue { grid-template-columns: minmax(0, 1fr); }
  .qpane { border-right: 0; }
  .dpane { position: fixed; inset: 0; z-index: 40; background: var(--paper); display: none; }
  .v-queue.show-detail .dpane { display: flex; animation: slidein .26s cubic-bezier(.2, .9, .3, 1); }
  @keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .dhead .back { display: inline-flex; }
  .dwrap { padding: 14px 14px 24px; padding-top: calc(14px + env(safe-area-inset-top)); }
  .dtitle h2 { font-size: 22px; }
  .actionbar { padding: 9px 14px; padding-bottom: calc(9px + env(safe-area-inset-bottom)); }
  .actionbar .btn kbd { display: none; }
  .ab-status { flex-basis: 100%; }
  .actionbar .btn { flex: 1; padding: 10px 12px; }
  .grid2 { grid-template-columns: 1fr; }
  .roles { grid-template-columns: auto minmax(96px, 130px); }
  .roles .samp { grid-column: 1 / -1; margin-top: -4px; }
  .bottomnav { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); background: var(--paper); padding-bottom: env(safe-area-inset-bottom); }
  .bottomnav button { border: 0; background: transparent; padding: 11px 6px 12px; font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
  .bottomnav button[aria-current="page"] { color: var(--ink); }
  .bottomnav button[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 2px; background: var(--pencil); }
  .bottomnav .n { color: var(--pencil); margin-left: 4px; letter-spacing: 0; }
  .page-in { padding: 16px 14px 28px; }
  .page-h h2 { font-size: 26px; }
  .toasts { left: 12px; right: 12px; bottom: 76px; align-items: stretch; }
  .toast { max-width: none; }
  .stamp { font-size: 22px; right: 14px; top: 12px; }
  .ucard .utop { padding: 22px 20px 6px 52px; }
  .ucard form { padding: 14px 20px 22px 52px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
}
</style>

];

var PH_SPLIT = /(\{(?:N|PH|TS|TID|URL|EMAIL|W\+|W)\})/;
